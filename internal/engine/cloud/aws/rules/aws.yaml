id: cloud.aws.inventory-truncated
engine: cloud-aws
title: Cloud inventory was truncated; coverage is incomplete
severity: info
what: An inventory list (security groups, volumes, buckets, users, keys or regions) hit scnr's pagination cap, or the scan-wide API call budget ran out before every check could run. Resources past the cap were not examined and the engine run is reported as partial.
why: Misconfigurations in the resources that were not listed are missing from this report, and findings from earlier scans cannot be marked fixed by this run.
fix: Narrow the scan with cloud.aws.regions in scnr.yaml, use the deep profile for a larger budget, or scan accounts with very large inventories in parts.
safety: safe
tags: [cloud, aws, coverage]
---
id: cloud.aws.iam.root-mfa-disabled
engine: cloud-aws
title: Root account has no MFA
severity: critical
cwe: CWE-308
what: The AWS account's root user, which can do anything in the account including closing it, has no multi-factor device registered.
why: A leaked or guessed root password alone is enough to take over the whole account.
fix: Sign in as root, open Security credentials and register a hardware or virtual MFA device. Then stop using root for day-to-day work.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/enable-virt-mfa-for-root.html"]
safety: safe
tags: [cloud, aws, iam]
---
id: cloud.aws.iam.root-access-keys
engine: cloud-aws
title: Root account has access keys
severity: critical
cwe: CWE-250
what: Long-lived programmatic access keys exist for the root user.
why: Root keys cannot be restricted by IAM policy; anyone holding them has full control of the account forever, and they are a favourite target in leaked repositories.
fix: Delete the root access keys in the root user's Security credentials page and create an IAM role or user with only the permissions needed.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user_manage_access-keys.html"]
safety: safe
tags: [cloud, aws, iam]
---
id: cloud.aws.iam.user-without-mfa
engine: cloud-aws
title: IAM user with console access has no MFA
severity: high
cwe: CWE-308
what: This IAM user can sign in to the console with a password and has no MFA device registered.
why: Password reuse and phishing are the common ways cloud consoles are taken over; MFA stops both.
fix: Register an MFA device for the user, or remove the console password if the user only needs programmatic access. Consider enforcing MFA with an IAM policy condition.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_enable.html"]
safety: safe
tags: [cloud, aws, iam]
---
id: cloud.aws.iam.password-policy-missing
engine: cloud-aws
title: No account password policy
severity: medium
cwe: CWE-521
what: The account has no IAM password policy, so AWS's permissive defaults apply to every console user.
why: Short, simple or never-rotated passwords make console accounts easy to guess or reuse from other breaches.
fix: Set an account password policy requiring at least 14 characters, all character classes and an expiry.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html"]
safety: safe
tags: [cloud, aws, iam]
---
id: cloud.aws.iam.password-policy-weak
engine: cloud-aws
title: Weak account password policy
severity: low
cwe: CWE-521
what: The IAM password policy allows passwords shorter than 14 characters, does not require every character class, or never expires passwords.
why: Weak policies let users pick passwords that appear in breach lists.
fix: Raise the minimum length to 14, require upper, lower, number and symbol characters, and set a maximum age.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html"]
safety: safe
tags: [cloud, aws, iam]
---
id: cloud.aws.iam.access-key-stale
engine: cloud-aws
title: Active access key older than 90 days
severity: medium
cwe: CWE-324
what: This IAM user has an active access key created more than 90 days ago.
why: The longer a key lives, the more places it has been copied to; rotation limits the window a leaked key is useful.
fix: Create a new key, move the workload to it, then deactivate and delete the old one. Prefer IAM roles over long-lived keys.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html#Using_RotateAccessKey"]
safety: safe
tags: [cloud, aws, iam]
---
id: cloud.aws.s3.bucket-public
engine: cloud-aws
title: S3 bucket is public
severity: high
cwe: CWE-284
what: The bucket's policy status reports it as public, or its ACL grants access to everyone or to any authenticated AWS user.
why: Public buckets are enumerated continuously; anything stored there should be considered downloaded.
fix: Remove the public policy statements or ACL grants and turn on Block Public Access for the bucket. Serve genuinely public content through CloudFront.
references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"]
safety: safe
tags: [cloud, aws, s3]
---
id: cloud.aws.s3.public-access-block-missing
engine: cloud-aws
title: S3 bucket without full Block Public Access
severity: medium
cwe: CWE-284
what: The bucket has no Block Public Access configuration, or one of its four settings is off.
why: Without the block, a single policy or ACL mistake makes the bucket public.
fix: Enable all four Block Public Access settings on the bucket (and at the account level).
references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"]
safety: safe
tags: [cloud, aws, s3]
---
id: cloud.aws.s3.encryption-disabled
engine: cloud-aws
title: S3 bucket without default encryption
severity: low
cwe: CWE-311
what: The bucket has no default server-side encryption configuration.
why: Objects written without an explicit encryption header are stored unencrypted; many compliance baselines require encryption at rest.
fix: Set a default encryption configuration (SSE-S3 or SSE-KMS) on the bucket.
references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html"]
safety: safe
tags: [cloud, aws, s3]
---
id: cloud.aws.s3.logging-disabled
engine: cloud-aws
title: S3 bucket without access logging
severity: low
cwe: CWE-778
what: Server access logging is not enabled for the bucket.
why: Without logs there is no record of who read or changed objects when investigating an incident.
fix: Enable server access logging to a dedicated log bucket, or rely on CloudTrail data events for the bucket.
references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerLogs.html"]
safety: safe
tags: [cloud, aws, s3]
