id: net.open-port
engine: netscan
title: Open TCP port
severity: info
cwe: CWE-200
what: A TCP port on this host accepted a connection, meaning a service is listening there.
why: Every listening service is something an attacker can talk to. Open ports are not a problem by themselves, but each one should be intentional and kept patched.
fix: If this service is not needed, stop it or block the port with a firewall. If it is needed, make sure it is up to date and only reachable from where it has to be.
safety: safe
tags: [network, inventory]
---
id: net.exposed-admin-port
engine: netscan
title: Remote administration service exposed
severity: high
cwe: CWE-284
what: A remote administration protocol (Telnet, RDP, VNC, WinRM or similar) is listening on this host.
why: Administration protocols give full control of the machine to anyone who can log in. Exposed to the internet they are constantly attacked with password guessing, and Telnet and VNC send credentials unencrypted.
fix: Do not expose administration ports publicly. Put them behind a VPN or an allow-listed firewall rule, require strong authentication (keys or MFA), and replace Telnet with SSH.
safety: safe
tags: [network, admin]
---
id: net.exposed-db-port
engine: netscan
title: Database or cache service exposed
severity: high
cwe: CWE-284
what: A database or cache service (Redis, MongoDB, Elasticsearch, Memcached, MySQL, PostgreSQL, MSSQL) is reachable on this host.
why: Databases hold your data and are often deployed without authentication or with default passwords. Exposed instances are found and emptied or ransomed within hours.
fix: Bind the service to localhost or a private interface, require authentication, and allow only application servers through the firewall.
safety: safe
tags: [network, database]
---
id: net.tls.expired
engine: netscan
title: TLS certificate has expired
severity: medium
cwe: CWE-298
what: The certificate presented by this service is past its expiry date.
why: Browsers and clients show warnings or refuse to connect, and users are trained to click through warnings, which makes real attacks easier.
fix: Renew the certificate and set up automatic renewal (for example with ACME/Let's Encrypt).
safety: safe
tags: [tls]
---
id: net.tls.expiring-soon
engine: netscan
title: TLS certificate expires within 14 days
severity: low
cwe: CWE-298
what: The certificate presented by this service expires in less than two weeks.
why: When it expires, clients will refuse to connect and the service will effectively be down.
fix: Renew the certificate now and automate renewal so this does not recur.
safety: safe
tags: [tls]
---
id: net.tls.self-signed
engine: netscan
title: TLS certificate is self-signed or not trusted
severity: medium
cwe: CWE-295
what: The certificate is not issued by a trusted certificate authority (it is self-signed or its chain is incomplete).
why: Clients cannot tell this server apart from an impostor, so an attacker on the network path can intercept traffic without triggering a different warning.
fix: Use a certificate from a trusted authority (free via Let's Encrypt) or, for internal services, deploy your internal CA to every client.
safety: safe
tags: [tls]
---
id: net.tls.hostname-mismatch
engine: netscan
title: TLS certificate does not match the hostname
severity: medium
cwe: CWE-297
what: The certificate is valid but was issued for a different name than the one used to reach this service.
why: Clients will warn or fail, and users learn to ignore the warning, which hides real man-in-the-middle attacks.
fix: Issue a certificate that includes this hostname in its Subject Alternative Names, or reach the service by the name on the certificate.
safety: safe
tags: [tls]
---
id: net.tls.legacy-version
engine: netscan
title: Legacy TLS version (1.0 or 1.1) accepted
severity: medium
cwe: CWE-326
what: The service completed a handshake using TLS 1.0 or TLS 1.1, protocol versions deprecated since 2021.
why: These versions have known weaknesses and fail compliance requirements (PCI DSS). Allowing them lets an attacker downgrade a connection to a weaker protocol.
fix: Configure the server to accept TLS 1.2 and 1.3 only.
safety: safe
tags: [tls]
---
id: net.tls.cipher-inventory
engine: netscan
title: TLS cipher suite inventory
severity: info
cwe: CWE-200
what: Lists the TLS cipher suites this service accepted during the scan (TLS 1.0-1.2 probed per cipher; TLS 1.3 reported as negotiated version only).
why: Inventory shows which ciphers are enabled so weak ones can be disabled and configuration drift can be spotted.
fix: No action needed for this finding itself. If weak ciphers are listed, disable them and keep only strong AEAD ciphers.
safety: safe
tags: [tls]
---
id: net.tls.weak-cipher
engine: netscan
title: Weak TLS cipher accepted
severity: medium
cwe: CWE-326
what: The service accepted a weak TLS cipher suite (RC4, DES, 3DES, NULL, EXPORT, anonymous, or otherwise insecure).
why: Weak ciphers can be broken or downgraded, letting an attacker decrypt traffic or pass compliance checks.
fix: Disable weak cipher suites and configure the server to accept only strong AEAD ciphers with TLS 1.2 and 1.3.
safety: safe
tags: [tls]
---
id: web.redirect-out-of-scope
engine: netscan
title: HTTP redirect points outside the authorised scope
severity: info
cwe: CWE-601
what: The service redirected to an address that is not within the scan scope, so scnr did not follow it.
why: Redirects to internal or unexpected addresses can indicate misconfiguration or an open redirect. Nothing was contacted at the destination.
fix: Review the redirect target. If it is unintended, fix the application's redirect configuration; if it is intended, add it to scope.allow to include it in future scans.
safety: safe
tags: [web]
---
id: net.mysql.version
engine: netscan
title: MySQL server version
severity: info
cwe: CWE-200
what: A MySQL or MariaDB server answered with this version in its greeting. No login was attempted.
why: Version inventory tells you what you are running so you can check it against vendor security announcements.
fix: No action needed for this finding itself. Compare the version against current MySQL or MariaDB releases and plan upgrades for unsupported lines.
safety: safe
tags: [network, database, inventory]
---
id: net.mysql.no-tls
engine: netscan
title: MySQL server does not offer TLS
severity: medium
cwe: CWE-319
what: The server greeting does not advertise TLS support, so clients log in and query over a plaintext connection.
why: Anyone able to observe the network path sees database credentials and query data, and can modify traffic in transit.
fix: Enable TLS on the server (ssl-ca/ssl-cert/ssl-key or the distribution defaults) and require it with require_secure_transport=ON.
safety: safe
tags: [network, database, tls]
---
id: net.mysql.legacy-auth
engine: netscan
title: MySQL pre-4.1 password authentication in use
severity: medium
cwe: CWE-327
what: The server (or one of its accounts) uses the pre-MySQL-4.1 password scheme, whose hashes are trivially cracked.
why: Short hashes from this scheme fall to brute force in hours, so any disclosure of the user table or captured login exposes the passwords.
fix: Migrate every account to caching_sha2_password (or mysql_native_password where older clients require it) and set new passwords.
safety: safe
tags: [network, database]
---
id: net.mysql.local-infile
engine: netscan
title: MySQL LOAD DATA LOCAL INFILE enabled
severity: medium
cwe: CWE-1188
what: The server has local_infile enabled, permitting LOAD DATA LOCAL INFILE statements.
why: This statement makes the server request files from the connecting client, so a compromised or malicious server (or SQL injection reaching it) can read arbitrary files from application hosts.
fix: Set local_infile=OFF unless an application genuinely needs it, and audit any workflow that does.
safety: safe
tags: [network, database]
---
id: net.mysql.databases
engine: netscan
title: MySQL user databases
severity: info
cwe: CWE-200
what: These non-system databases exist on the server, listed with the credentials from --auth-file.
why: Database inventory shows what data this instance holds so each database can be matched to an owner and a backup.
fix: No action needed for this finding itself. Remove databases that have no owner.
safety: safe
tags: [network, database, inventory]
---
id: net.mysql.remote-root
engine: netscan
title: MySQL root login allowed from remote hosts
severity: high
cwe: CWE-284
what: A root account accepts connections from a non-loopback host.
why: Root can read, change and delete everything on the server. A remotely reachable root login is the first account password guessing attacks try.
fix: Restrict root to localhost (or delete remote root accounts) and use named, least-privilege accounts for applications.
safety: safe
tags: [network, database]
---
id: net.mysql.anonymous-user
engine: netscan
title: MySQL anonymous account exists
severity: high
cwe: CWE-284
what: An account with an empty username exists on the server.
why: Anonymous accounts let anyone connect without proving who they are; with a remote host part they are reachable from the network.
fix: Drop anonymous accounts (DROP USER ''@'host' for each one shown) and re-run the scan to confirm.
safety: safe
tags: [network, database]
---
id: net.mysql.empty-password
engine: netscan
title: MySQL account with an empty password
severity: high
cwe: CWE-521
what: A password-authenticated account reachable from the network has an empty password.
why: Anyone who can reach the port can log in as this account with no credential at all.
fix: Set a strong password (ALTER USER ... IDENTIFIED BY ...) or drop the account, then re-run the scan to confirm.
safety: safe
tags: [network, database]
---
id: net.mysql.cve-2012-2122
engine: netscan
title: MySQL authentication bypass (CVE-2012-2122)
severity: critical
cwe: CWE-681
what: A wrong-password login was accepted, proving this server is vulnerable to the CVE-2012-2122 authentication bypass. Only a random wrong password was sent; no real credential was used or learned.
why: The bug lets anyone log in as any user (including root) by retrying a wrong password, giving full database access without credentials.
fix: Upgrade MySQL or MariaDB to a fixed release immediately (any supported line) and rotate all database credentials in case the bypass was already used.
safety: intrusive
tags: [network, database]
