id: secret.url-credentials
engine: secrets
title: Credentials embedded in a URL
severity: high
cwe: CWE-522
what: A URL with a username and password (scheme://user:password@host) was found.
why: Connection strings with embedded passwords leak through logs, error messages and version history.
fix: Supply the password through environment variables or a secrets manager and reference it at runtime.
safety: safe
tags: [secrets, generic]
