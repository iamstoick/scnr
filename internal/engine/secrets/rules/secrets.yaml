id: secret.github-token
engine: secrets
title: GitHub token in source
severity: critical
cwe: CWE-798
what: A GitHub personal access, OAuth or app token (ghp_, gho_, ghu_, ghs_, ghr_, github_pat_) was found.
why: "The token acts as the user or app that created it: reading private code, pushing commits, changing settings."
fix: Revoke the token in GitHub settings, create a new one with minimal scopes, and store it in a secret store rather than in files.
safety: safe
tags: [secrets, github]
