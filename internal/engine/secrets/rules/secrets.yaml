id: secret.gcp-service-account
engine: secrets
title: Google Cloud service account key in source
severity: critical
cwe: CWE-798
what: A Google Cloud service account JSON key (type service_account with a private_key field) was found.
why: Service account keys grant whatever IAM roles the account has, do not expire, and are a leading cause of cloud account compromise.
fix: Delete the key in the Cloud Console, create a new one if truly needed (prefer Workload Identity), and remove the file from the repository and its history.
safety: safe
tags: [secrets, gcp]
