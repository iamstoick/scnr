id: secret.gitlab-token
engine: secrets
title: GitLab token in source
severity: critical
cwe: CWE-798
what: A GitLab personal access token (glpat-…) was found.
why: The token grants API and repository access as its owner.
fix: Revoke it in GitLab, issue a new scoped token and keep it in CI variables or a secrets manager.
safety: safe
