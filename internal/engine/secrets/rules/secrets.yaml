id: secret.generic-password
engine: secrets
title: Hard-coded password or API key
severity: high
cwe: CWE-259
what: A variable named like a password, secret, token or API key is assigned a literal value that looks random.
why: Hard-coded credentials are shared with everyone who can read the code and cannot be rotated without a deploy.
fix: Load the value from an environment variable or secrets manager, and rotate the credential since it has been exposed.
safety: safe
tags: [secrets, generic]
---
id: secret.generic-high-entropy
engine: secrets
title: High-entropy string (possible secret)
severity: medium
cwe: CWE-798
what: A quoted string with high randomness (Shannon entropy >= 4.0) was found. This is a pattern match and may be a hash, an ID or test data rather than a secret.
why: Random-looking strings in source are frequently API keys or tokens. Verify in context.
fix: If it is a credential, move it to a secret store and rotate it. If it is not, consider adding it to a baseline so it is not reported again.
safety: safe
tags: [secrets, entropy, tentative]
