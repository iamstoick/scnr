id: secret.slack-token
engine: secrets
title: Slack token or webhook in source
severity: critical
cwe: CWE-798
what: A Slack API token (xoxb-/xoxp-/xoxa-…) or incoming webhook URL was found.
why: It lets anyone post as your bot or read workspace data, which is both a privacy and a phishing risk.
fix: Revoke the token or webhook in the Slack app settings and move the replacement into environment configuration.
safety: safe
