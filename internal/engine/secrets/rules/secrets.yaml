id: secret.google-api-key
engine: secrets
title: Google API key in source
severity: high
cwe: CWE-798
what: A Google API key (AIza…) was found.
why: Unrestricted API keys can be abused to run up quota and billing on your project.
fix: Restrict the key to specific APIs and referrers in the Cloud Console, or regenerate it; never commit it.
