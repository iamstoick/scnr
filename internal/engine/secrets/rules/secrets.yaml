id: secret.private-key
engine: secrets
title: Private key block in source
severity: critical
cwe: CWE-321
what: A PEM private key block (RSA, EC, OpenSSH, PGP or generic PRIVATE KEY) was found.
why: Private keys authenticate servers and users; anyone with the key can impersonate the owner or decrypt traffic.
fix: "Treat the key as compromised: generate a new key pair, replace it everywhere it is used, and remove the file from the repository and history."
safety: safe
tags: [secrets, keys]
