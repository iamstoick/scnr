id: secret.stripe-key
engine: secrets
title: Stripe secret key in source
severity: critical
cwe: CWE-798
what: A Stripe secret or restricted key (sk_live_, sk_test_, rk_live_…) was found.
why: Live keys can create charges, issue refunds and read customer payment data.
fix: Roll the key in the Stripe dashboard and load it from environment variables.
