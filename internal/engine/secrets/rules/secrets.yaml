id: secret.jwt
engine: secrets
title: JSON Web Token in source
severity: high
cwe: CWE-798
what: A JWT (three base64url segments starting with eyJ) was found.
why: "A JWT is a bearer credential: until it expires, anyone holding it is logged in as that user or service."
fix: Invalidate the token if possible, shorten token lifetimes, and keep tokens out of source files and test fixtures.
safety: safe
tags: [secrets, tokens]
