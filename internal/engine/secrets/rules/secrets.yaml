id: secret.aws-access-key
engine: secrets
title: AWS access key ID in source
severity: critical
cwe: CWE-798
what: A string shaped like an AWS access key ID (AKIA… or ASIA…) was found in a file in this repository.
why: Anyone with this key and its secret can act as your AWS account - start servers, read buckets, run up bills. Keys committed to repositories are harvested by bots within minutes of becoming public.
fix: Revoke the key in IAM immediately and issue a new one. Move credentials to environment variables or a secrets manager, add the file to .gitignore, and rewrite history if the repo was ever shared.
references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"]
safety: safe
tags: [secrets, aws]
---
id: secret.aws-secret-key
engine: secrets
title: AWS secret access key in source
severity: critical
cwe: CWE-798
what: A 40-character AWS secret access key appears next to an AWS-related variable name.
why: Combined with the access key ID this gives full programmatic access to your AWS account.
fix: Revoke and rotate the key pair in IAM, then move credentials out of the codebase into a secrets manager.
safety: safe
tags: [secrets, aws]
