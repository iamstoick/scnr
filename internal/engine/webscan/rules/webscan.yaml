id: web.header.csp-missing
engine: webscan
title: Content-Security-Policy header missing
severity: low
cwe: CWE-1021
what: The page is served without a Content-Security-Policy header.
why: CSP tells browsers which scripts, styles and frames a page may load. Without it, a single cross-site scripting bug lets an attacker run any script they like in your users' browsers.
fix: Add a Content-Security-Policy header. Start in report-only mode (Content-Security-Policy-Report-Only) with a policy such as "default-src 'self'", fix the violations it reports, then enforce it.
safety: safe
tags: [web, headers]
---
id: web.header.hsts-missing
engine: webscan
title: Strict-Transport-Security header missing on HTTPS site
severity: low
cwe: CWE-319
what: The HTTPS response does not include a Strict-Transport-Security (HSTS) header.
why: Without HSTS a browser may still try plain HTTP first on later visits, which lets an attacker on the same network downgrade or intercept the connection.
fix: >-
  Send "Strict-Transport-Security: max-age=31536000; includeSubDomains" on every HTTPS response once you are sure the whole site works over HTTPS.
safety: safe
tags: [web, headers, tls]
---
id: web.header.xcto-missing
engine: webscan
title: X-Content-Type-Options header missing
severity: low
cwe: CWE-16
what: >-
  The response does not include "X-Content-Type-Options: nosniff".
why: Without it, some browsers guess a file's type from its content, so an uploaded file that claims to be an image can be executed as script.
fix: >-
  Add the header "X-Content-Type-Options: nosniff" to every response.
safety: safe
tags: [web, headers]
---
id: web.header.frame-protection-missing
engine: webscan
title: No protection against the page being framed (clickjacking)
severity: low
cwe: CWE-1021
what: Neither an X-Frame-Options header nor a CSP frame-ancestors directive restricts which sites may embed this page in a frame.
why: A malicious site can load your page invisibly in a frame and trick users into clicking buttons on it (clickjacking).
fix: >-
  Add "Content-Security-Policy: frame-ancestors 'self'" (or 'none'), and "X-Frame-Options: SAMEORIGIN" for older browsers.
safety: safe
tags: [web, headers]
---
id: web.cookie.insecure-flags
engine: webscan
title: Cookie set without protective flags
severity: medium
cwe: CWE-614
what: A cookie is set without one or more of the Secure, HttpOnly and SameSite attributes.
why: Without Secure the cookie can be sent over plain HTTP and intercepted; without HttpOnly any script on the page (including injected ones) can read it; without SameSite it is sent on cross-site requests, enabling CSRF.
fix: Set session and authentication cookies with "Secure; HttpOnly; SameSite=Lax" (or Strict). Only cookies that JavaScript genuinely needs should omit HttpOnly.
safety: safe
tags: [web, cookies]
---
id: web.server-version-disclosure
engine: webscan
title: Software version disclosed in a response header
severity: info
cwe: CWE-200
what: A response header (Server, X-Powered-By or similar) reveals the exact software version in use.
why: Knowing the exact version lets an attacker look up known vulnerabilities for it instead of guessing. It does not create a vulnerability by itself.
fix: Configure the server to omit version details (e.g. "ServerTokens Prod" for Apache, "server_tokens off" for nginx, remove X-Powered-By in the application).
safety: safe
tags: [web, headers, disclosure]
---
id: web.cors.credentials-any-origin
engine: webscan
title: CORS allows credentials from any origin
severity: medium
cwe: CWE-942
what: The server answers cross-origin requests with Access-Control-Allow-Credentials true while allowing any origin (a wildcard or by reflecting the request's Origin).
why: Any website a logged-in user visits can read responses from this site with the user's cookies, which exposes their data and actions.
fix: Only reflect origins from an explicit allow list, and never combine Access-Control-Allow-Credentials with a wildcard or an unchecked reflected origin.
safety: safe
tags: [web, cors]
---
id: web.mixed-content
engine: webscan
title: HTTPS page loads resources over plain HTTP
severity: low
cwe: CWE-319
what: The HTTPS page references scripts, styles or images with http:// URLs.
why: Those resources can be altered by anyone on the network path; browsers block some of them, which also breaks the page.
fix: >-
  Reference all resources with https:// (or protocol-relative) URLs and add "Content-Security-Policy: upgrade-insecure-requests".
safety: safe
tags: [web, tls]
---
id: web.redirect-out-of-scope
engine: webscan
title: Redirect points outside the authorised scope
severity: info
cwe: CWE-601
what: The server responded with a redirect to a location that is not within the scanned scope, so scnr did not follow it.
why: Nothing was scanned at the destination. If the destination is yours, add it to scope.allow and re-run; if it is not, this is only informational.
fix: Review the redirect target; if it should be in scope, add it to scnr.yaml and scan it explicitly.
safety: safe
tags: [web, scope]
---
id: web.reflected-input
engine: webscan
title: User input is reflected into the page without encoding (possible XSS)
severity: medium
cwe: CWE-79
what: A probe value sent in a page parameter came back in the HTML unescaped, in a text or attribute context.
why: When an application echoes request parameters into HTML without encoding them, an attacker can often inject script that runs in other users' browsers (cross-site scripting).
fix: HTML-encode every value interpolated into the page (or build pages with a framework that escapes by default), and deploy a Content-Security-Policy as defence in depth.
safety: intrusive
tags: [web, xss, active]
---
id: web.reflected-input-escaped
engine: webscan
title: Probe value reflected with encoding applied
severity: info
what: A probe value sent in a page parameter came back in the response with its quotes encoded, so it cannot break out of its HTML context.
why: "This is the safe outcome: the application encodes the value before echoing it. Recorded so the probe coverage is visible."
fix: No action needed.
safety: intrusive
tags: [web, xss, active]
---
id: web.open-redirect
engine: webscan
title: Open redirect through a request parameter
severity: medium
cwe: CWE-601
what: Setting a redirect-shaped parameter to an external canary host made the server redirect there.
why: Attackers abuse open redirects to make phishing links look trustworthy (the visible domain is yours, the landing page is theirs) and to steal OAuth tokens passed through redirect URLs.
fix: Redirect only to relative paths or to a fixed allow list of destinations; never to a raw request parameter.
safety: intrusive
tags: [web, redirect, active]
---
id: web.error-disclosure
engine: webscan
title: Detailed error message discloses internals
severity: low
cwe: CWE-209
what: A request carrying a single quote character in a parameter produced a server error or a database/framework error signature in the response.
why: Stack traces and database errors reveal software versions, paths and query structure that help an attacker tune a real injection attack. The 500 itself may also mean the input broke the page.
fix: Return a generic error page (no trace, no SQL text) and log the details server-side; use parameterised queries throughout.
safety: intrusive
tags: [web, errors, active]
---
id: web.state-changing-get
engine: webscan
title: A GET link appears to change state
severity: info
cwe: CWE-352
what: A crawlable link whose URL or text names a state-changing action (logout, delete, publish, …) was inventoried and deliberately never requested.
why: "Actions reachable by GET can be triggered by anything that loads a URL: a prefetcher, a chat preview, or an attacker's hidden image (cross-site request forgery). scnr does not touch such links; this finding asks a human to check they require POST with a CSRF token."
fix: Move state-changing actions behind POST (or another non-idempotent method) with per-session CSRF tokens; keep GET side-effect free.
safety: intrusive
tags: [web, csrf, active]
---
id: web.form-inventory
engine: webscan
title: POST form inventoried, never submitted
severity: info
what: A form with method=post was found during the crawl. scnr records its action and field names only and never submits it.
why: Submitting forms can create, change or delete data, so active scans only inventory them. Review the list for forms that lack CSRF protection or handle sensitive data.
fix: No action needed for the scan; ensure each form requires a per-session CSRF token.
safety: intrusive
tags: [web, forms, active]
---
id: web.crawl-truncated
engine: webscan
title: Crawl stopped at a coverage cap
severity: info
what: The crawler hit a budget (depth, URL count, form count or parameter-pair count) and stopped discovering new pages.
why: "Coverage is partial: pages beyond the cap were not crawled or probed, so findings from this engine cannot vouch for their absence."
fix: Re-run with --profile deep for doubled crawl budgets, or narrow the target to the section you care about.
safety: intrusive
tags: [web, coverage, active]
---
id: web.probe-truncated
engine: webscan
title: Probing stopped at the request budget
severity: info
what: Active probing hit the per-target request budget and stopped; remaining parameters were not probed.
why: "Coverage is partial: unprobed parameters may still reflect input or redirect. Findings from this engine cannot vouch for their absence."
fix: Re-run with --profile deep for a tripled probe budget, or narrow the target to the section you care about.
safety: intrusive
tags: [web, coverage, active]
---
id: web.session-invalidated
engine: webscan
title: Authenticated session was cleared mid-scan
severity: info
what: The server cleared the authenticated session cookie during probing, so the probe phase stopped rather than continue unauthenticated.
why: Coverage after this point is partial, and results would mix authenticated and anonymous behaviour. The crawl may have visited a logout-shaped page that the destructive-word list did not catch — please report it.
fix: Re-run; if it recurs, check for logout links whose wording is not in the destructive-word list.
safety: intrusive
tags: [web, auth, active]
