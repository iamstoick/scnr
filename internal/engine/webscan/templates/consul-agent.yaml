# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "consul-agent"
info:
  title: "HashiCorp Consul agent API exposed"
  severity: "high"
  cwe: "CWE-306"
  what: "A back-end service's HTTP interface is reachable at /v1/agent/self without authentication."
  why: "Databases, caches, orchestration and registry services exposed to the web can be read, modified or used to pivot into the infrastructure."
  fix: "Bind the service to a private interface, require authentication, and put it behind a firewall or VPN."
  tags: ["service"]
safety: safe
http:
  - method: GET
    path: ["/v1/agent/self", "/v1/catalog/services"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(\"Config\"\\s*:|\"consul\"\\s*:)"]
