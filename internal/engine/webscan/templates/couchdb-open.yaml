# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "couchdb-open"
info:
  title: "CouchDB HTTP API exposed"
  severity: "high"
  cwe: "CWE-306"
  what: "A back-end service's HTTP interface is reachable at / without authentication."
  why: "Databases, caches, orchestration and registry services exposed to the web can be read, modified or used to pivot into the infrastructure."
  fix: "Bind the service to a private interface, require authentication, and put it behind a firewall or VPN."
  tags: ["service", "database"]
safety: safe
http:
  - method: GET
    path: ["/", "/_all_dbs", "/_utils/"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(\"couchdb\"\\s*:\\s*\"Welcome\"|Fauxton|^\\[\\s*\"_)"]
