# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "crossdomain-xml-wildcard"
info:
  title: "crossdomain.xml allows any domain"
  severity: "medium"
  cwe: "CWE-942"
  what: "A cross-domain policy file at /crossdomain.xml grants access to every domain."
  why: "Flash and Silverlight style policy files that allow '*' let any website make authenticated requests to this site on behalf of a visitor."
  fix: "Remove the file or restrict it to the specific domains that need access."
  tags: ["policy"]
safety: safe
http:
  - method: GET
    path: ["/crossdomain.xml"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["allow-access-from\\s+domain=\"\\*\""]
