# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "docker-registry-catalog"
info:
  title: "Docker registry catalog exposed"
  severity: "high"
  cwe: "CWE-306"
  what: "A back-end service's HTTP interface is reachable at /v2/_catalog without authentication."
  why: "Databases, caches, orchestration and registry services exposed to the web can be read, modified or used to pivot into the infrastructure."
  fix: "Bind the service to a private interface, require authentication, and put it behind a firewall or VPN."
  tags: ["service", "docker"]
safety: safe
http:
  - method: GET
    path: ["/v2/_catalog", "/v2/"]
    matchers-condition: or
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(\"repositories\"\\s*:|^\\{\\}$)"]
      - type: header
        name: "Docker-Distribution-Api-Version"
        regex: ["registry/2\\.0"]
        condition: "or"
