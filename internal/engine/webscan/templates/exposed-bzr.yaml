# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-bzr"
info:
  title: "Bazaar metadata exposed (.bzr)"
  severity: "medium"
  cwe: "CWE-538"
  what: "Version-control metadata at /.bzr/README is exposed, which usually means the whole repository can be downloaded."
  why: "Attackers reconstruct the full source code and history from exposed repositories, including deleted files and committed secrets."
  fix: "Deny access to .git, .svn, .hg and similar directories in the web server (or deploy without them) and rotate any secret that was ever committed."
  tags: ["exposure", "vcs"]
safety: safe
http:
  - method: GET
    path: ["/.bzr/README", "/.bzr/branch-format"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Bazaar"]
