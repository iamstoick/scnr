# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-changelog"
info:
  title: "CHANGELOG or release notes exposed"
  severity: "info"
  cwe: "CWE-200"
  what: "The file /CHANGELOG.md discloses software names and versions."
  why: "Exact versions let an attacker pick known exploits instead of guessing. Low impact on its own."
  fix: "Remove the file or block access to it in the web server."
  tags: ["disclosure"]
safety: safe
http:
  - method: GET
    path: ["/CHANGELOG.md", "/CHANGELOG", "/changelog.txt", "/RELEASE_NOTES.md"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^(#+ |v?\\d+\\.\\d+\\.\\d+)"]
