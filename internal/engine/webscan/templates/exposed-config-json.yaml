# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-config-json"
info:
  title: "Configuration JSON with secret-like keys exposed"
  severity: "high"
  cwe: "CWE-538"
  what: "The configuration file /config.json is served to anyone who asks for it."
  why: "Configuration files reveal internal hostnames, settings and sometimes credentials, which makes targeted attacks much easier."
  fix: "Move configuration out of the web root or deny access to it in the web server, then check whether it contained any secret that must be rotated."
  tags: ["exposure", "secrets"]
safety: safe
http:
  - method: GET
    path: ["/config.json", "/config/config.json", "/settings.json"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?i)\"(password|secret|token|api_?key|private_?key)\"\\s*:"]
