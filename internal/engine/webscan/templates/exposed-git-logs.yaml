# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-git-logs"
info:
  title: "Git reflog exposed (.git/logs/HEAD)"
  severity: "critical"
  cwe: "CWE-538"
  what: "Version-control metadata at /.git/logs/HEAD is exposed, which usually means the whole repository can be downloaded."
  why: "Attackers reconstruct the full source code and history from exposed repositories, including deleted files and committed secrets."
  fix: "Deny access to .git, .svn, .hg and similar directories in the web server (or deploy without them) and rotate any secret that was ever committed."
  tags: ["exposure", "vcs", "git"]
safety: safe
http:
  - method: GET
    path: ["/.git/logs/HEAD"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["^[0-9a-f]{40} [0-9a-f]{40}"]
