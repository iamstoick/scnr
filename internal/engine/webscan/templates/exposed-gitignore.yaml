# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-gitignore"
info:
  title: "Gitignore file present"
  severity: "info"
  cwe: "CWE-200"
  what: "The file /.gitignore is present and public."
  why: "This is informational: it is normal for many sites but worth knowing about."
  fix: "Review the contents and make sure nothing sensitive is listed."
  tags: ["exposure", "vcs"]
safety: safe
http:
  - method: GET
    path: ["/.gitignore"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^(node_modules|\\.env|\\*\\.log|vendor|dist|build)\\b"]
