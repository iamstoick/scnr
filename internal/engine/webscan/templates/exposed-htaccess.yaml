# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-htaccess"
info:
  title: "Apache .htaccess readable"
  severity: "low"
  cwe: "CWE-538"
  what: "The configuration file /.htaccess is served to anyone who asks for it."
  why: "Configuration files reveal internal hostnames, settings and sometimes credentials, which makes targeted attacks much easier."
  fix: "Move configuration out of the web root or deny access to it in the web server, then check whether it contained any secret that must be rotated."
  tags: ["exposure", "apache"]
safety: safe
http:
  - method: GET
    path: ["/.htaccess"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^\\s*(RewriteEngine|RewriteRule|AuthType|Options|Deny|Require)\\b"]
