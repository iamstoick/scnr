# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-java-build"
info:
  title: "Java build file exposed"
  severity: "low"
  cwe: "CWE-200"
  what: "The dependency manifest /pom.xml is publicly readable."
  why: "It lists the exact libraries and versions in use, letting an attacker look up known vulnerabilities for each. Low impact on its own."
  fix: "Deny access to build and dependency files in the web server, or deploy only the built artefacts."
  tags: ["exposure", "java"]
safety: safe
http:
  - method: GET
    path: ["/pom.xml", "/build.gradle", "/build.gradle.kts"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(<project|dependencies\\s*\\{|plugins\\s*\\{)"]
