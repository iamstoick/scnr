# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-joomla-config-backup"
info:
  title: "Joomla configuration backup exposed"
  severity: "critical"
  cwe: "CWE-538"
  what: "The file /configuration.php.bak is publicly downloadable. Files of this kind hold credentials, keys or connection strings."
  why: "Anyone on the internet can read the credentials inside and use them to log in to your database, cloud account or third-party services as you."
  fix: "Remove the file from the web root immediately, rotate every credential it contains, and add a web-server rule that denies access to dotfiles and configuration files."
  tags: ["exposure", "secrets", "joomla"]
safety: safe
http:
  - method: GET
    path: ["/configuration.php.bak", "/configuration.php~", "/configuration.php.old"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["JConfig", "password"]
