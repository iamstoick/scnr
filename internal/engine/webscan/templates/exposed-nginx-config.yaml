# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-nginx-config"
info:
  title: "nginx configuration exposed"
  severity: "high"
  cwe: "CWE-538"
  what: "The configuration file /nginx.conf is served to anyone who asks for it."
  why: "Configuration files reveal internal hostnames, settings and sometimes credentials, which makes targeted attacks much easier."
  fix: "Move configuration out of the web root or deny access to it in the web server, then check whether it contained any secret that must be rotated."
  tags: ["exposure", "nginx"]
safety: safe
http:
  - method: GET
    path: ["/nginx.conf", "/conf/nginx.conf"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^\\s*(server|http|location|upstream)\\b.*\\{"]
