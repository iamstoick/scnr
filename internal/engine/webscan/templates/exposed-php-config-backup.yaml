# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-php-config-backup"
info:
  title: "PHP configuration backup exposed as text"
  severity: "high"
  cwe: "CWE-538"
  what: "The configuration file /config.php.bak is served to anyone who asks for it."
  why: "Configuration files reveal internal hostnames, settings and sometimes credentials, which makes targeted attacks much easier."
  fix: "Move configuration out of the web root or deny access to it in the web server, then check whether it contained any secret that must be rotated."
  tags: ["exposure", "php"]
safety: safe
http:
  - method: GET
    path: ["/config.php.bak", "/config.php~", "/config.inc.php.bak", "/config.old", "/config.php.save", "/database.php.bak"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["<?php"]
