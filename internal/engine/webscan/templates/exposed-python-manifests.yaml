# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-python-manifests"
info:
  title: "Python dependency manifest exposed"
  severity: "low"
  cwe: "CWE-200"
  what: "The dependency manifest /requirements.txt is publicly readable."
  why: "It lists the exact libraries and versions in use, letting an attacker look up known vulnerabilities for each. Low impact on its own."
  fix: "Deny access to build and dependency files in the web server, or deploy only the built artefacts."
  tags: ["exposure", "python"]
safety: safe
http:
  - method: GET
    path: ["/requirements.txt", "/Pipfile", "/Pipfile.lock", "/pyproject.toml", "/poetry.lock"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^([A-Za-z0-9_.-]+==|\\[packages\\]|\\[tool\\.poetry|name = \")"]
