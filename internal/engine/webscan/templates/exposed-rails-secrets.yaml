# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-rails-secrets"
info:
  title: "Rails secrets or database configuration exposed"
  severity: "critical"
  cwe: "CWE-538"
  what: "The file /config/secrets.yml is publicly downloadable. Files of this kind hold credentials, keys or connection strings."
  why: "Anyone on the internet can read the credentials inside and use them to log in to your database, cloud account or third-party services as you."
  fix: "Remove the file from the web root immediately, rotate every credential it contains, and add a web-server rule that denies access to dotfiles and configuration files."
  tags: ["exposure", "secrets", "rails"]
safety: safe
http:
  - method: GET
    path: ["/config/secrets.yml", "/config/database.yml", "/config/credentials.yml.enc"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^(production|development|test):"]
