# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-ruby-manifests"
info:
  title: "Ruby Gemfile or Gemfile.lock exposed"
  severity: "low"
  cwe: "CWE-200"
  what: "The dependency manifest /Gemfile is publicly readable."
  why: "It lists the exact libraries and versions in use, letting an attacker look up known vulnerabilities for each. Low impact on its own."
  fix: "Deny access to build and dependency files in the web server, or deploy only the built artefacts."
  tags: ["exposure", "ruby"]
safety: safe
http:
  - method: GET
    path: ["/Gemfile", "/Gemfile.lock"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?m)^(GEM|source |gem )"]
