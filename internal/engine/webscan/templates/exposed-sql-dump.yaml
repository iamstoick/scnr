# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-sql-dump"
info:
  title: "SQL database dump exposed"
  severity: "critical"
  cwe: "CWE-538"
  what: "A backup or dump file at /dump.sql is downloadable."
  why: "Backups contain your database contents or source code, often including user data and credentials."
  fix: "Delete the file from the web root, store backups outside it with restricted permissions, and rotate any credentials inside."
  tags: ["exposure", "backup", "database"]
safety: safe
http:
  - method: GET
    path: ["/dump.sql", "/backup.sql", "/db.sql", "/database.sql", "/data.sql", "/mysql.sql", "/site.sql"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?i)(CREATE TABLE|INSERT INTO|DROP TABLE)"]
