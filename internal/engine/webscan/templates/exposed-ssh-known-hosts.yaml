# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-ssh-known-hosts"
info:
  title: "SSH known_hosts or authorized_keys exposed"
  severity: "medium"
  cwe: "CWE-538"
  what: "The file /.ssh/known_hosts discloses software names and versions."
  why: "Exact versions let an attacker pick known exploits instead of guessing. Low impact on its own."
  fix: "Remove the file or block access to it in the web server."
  tags: ["exposure", "ssh"]
safety: safe
http:
  - method: GET
    path: ["/.ssh/known_hosts", "/.ssh/authorized_keys"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256) AAAA"]
