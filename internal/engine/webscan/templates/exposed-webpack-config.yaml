# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "exposed-webpack-config"
info:
  title: "webpack configuration exposed"
  severity: "low"
  cwe: "CWE-538"
  what: "The configuration file /webpack.config.js is served to anyone who asks for it."
  why: "Configuration files reveal internal hostnames, settings and sometimes credentials, which makes targeted attacks much easier."
  fix: "Move configuration out of the web root or deny access to it in the web server, then check whether it contained any secret that must be rotated."
  tags: ["exposure"]
safety: safe
http:
  - method: GET
    path: ["/webpack.config.js", "/webpack.prod.js"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["module.exports", "entry"]
