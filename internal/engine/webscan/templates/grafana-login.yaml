# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "grafana-login"
info:
  title: "Grafana login page reachable"
  severity: "info"
  cwe: "CWE-200"
  what: "The file /login is present and public."
  why: "This is informational: it is normal for many sites but worth knowing about."
  fix: "Review the contents and make sure nothing sensitive is listed."
  tags: ["service"]
safety: safe
http:
  - method: GET
    path: ["/login", "/api/health"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(<title>Grafana|\"database\"\\s*:\\s*\"ok\")"]
