# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "graphql-playground"
info:
  title: "GraphQL IDE exposed"
  severity: "low"
  cwe: "CWE-200"
  what: "API documentation or an API schema is exposed at /graphql."
  why: "It gives a complete map of your API, including endpoints that were meant to be internal. Informational unless the endpoints lack authentication."
  fix: "Decide deliberately whether the documentation should be public; if not, restrict it to authenticated users."
  tags: ["api", "graphql"]
safety: safe
http:
  - method: GET
    path: ["/graphql", "/graphiql", "/playground", "/graphql/playground"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(GraphQL Playground|GraphiQL|graphiql\\.min)"]
