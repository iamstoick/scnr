# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "humans-txt"
info:
  title: "humans.txt present"
  severity: "info"
  cwe: "CWE-200"
  what: "The file /humans.txt is present and public."
  why: "This is informational: it is normal for many sites but worth knowing about."
  fix: "Review the contents and make sure nothing sensitive is listed."
  tags: ["info"]
safety: safe
http:
  - method: GET
    path: ["/humans.txt"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?i)(team|site|thanks)"]
