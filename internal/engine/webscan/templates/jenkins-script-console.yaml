# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "jenkins-script-console"
info:
  title: "Jenkins script console reachable without login"
  severity: "critical"
  cwe: "CWE-284"
  what: "An administrative or management interface is reachable at /script."
  why: "Management consoles are high-value targets: default or weak credentials, or a missing login, give full control of the application or server."
  fix: "Restrict the interface to trusted networks (VPN or allow-listed IPs), require strong authentication and MFA, and remove it if it is not needed."
  tags: ["admin", "jenkins"]
safety: safe
http:
  - method: GET
    path: ["/script"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Script Console"]
      - type: word
        words: ["j_username"]
        negative: true
