# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "kubernetes-api"
info:
  title: "Kubernetes API server reachable"
  severity: "high"
  cwe: "CWE-306"
  what: "A back-end service's HTTP interface is reachable at /api/v1 without authentication."
  why: "Databases, caches, orchestration and registry services exposed to the web can be read, modified or used to pivot into the infrastructure."
  fix: "Bind the service to a private interface, require authentication, and put it behind a firewall or VPN."
  tags: ["service", "kubernetes"]
safety: safe
http:
  - method: GET
    path: ["/api/v1", "/api", "/apis"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["\"(APIResourceList|APIVersions|APIGroupList)\""]
