# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "laravel-horizon"
info:
  title: "Laravel Horizon dashboard exposed"
  severity: "medium"
  cwe: "CWE-489"
  what: "A debugging or diagnostics endpoint is enabled at /horizon."
  why: "Debug endpoints leak configuration, environment variables, request data and sometimes allow code execution."
  fix: "Disable debug and profiler features in production and restrict any remaining diagnostics endpoints to internal networks."
  tags: ["debug", "laravel"]
safety: safe
http:
  - method: GET
    path: ["/horizon", "/horizon/dashboard"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Horizon"]
