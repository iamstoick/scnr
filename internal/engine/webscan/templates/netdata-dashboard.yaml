# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "netdata-dashboard"
info:
  title: "Netdata dashboard reachable"
  severity: "info"
  cwe: "CWE-200"
  what: "A Netdata monitoring dashboard is served at /."
  why: "This is informational: live host metrics, process lists, and network details help an attacker map the system."
  fix: "Restrict the dashboard to localhost or monitoring hosts only."
  tags: ["service"]
safety: safe
http:
  - method: GET
    path: ["/"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["<[Tt]itle>[^<]*netdata"]
