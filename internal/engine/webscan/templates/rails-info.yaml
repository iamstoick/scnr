# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "rails-info"
info:
  title: "Rails info pages exposed"
  severity: "medium"
  cwe: "CWE-489"
  what: "A debugging or diagnostics endpoint is enabled at /rails/info/properties."
  why: "Debug endpoints leak configuration, environment variables, request data and sometimes allow code execution."
  fix: "Disable debug and profiler features in production and restrict any remaining diagnostics endpoints to internal networks."
  tags: ["debug", "rails"]
safety: safe
http:
  - method: GET
    path: ["/rails/info/properties", "/rails/info/routes"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(Rails version|Ruby version|Routes)"]
