# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "robots-txt"
info:
  title: "robots.txt lists disallowed paths"
  severity: "info"
  cwe: "CWE-200"
  what: "The file /robots.txt is present and public."
  why: "This is informational: it is normal for many sites but worth knowing about."
  fix: "Review the contents and make sure nothing sensitive is listed."
  tags: ["info"]
safety: safe
http:
  - method: GET
    path: ["/robots.txt"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(?mi)^Disallow:\\s*\\S"]
