# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "sitemap-xml"
info:
  title: "sitemap.xml present"
  severity: "info"
  cwe: "CWE-200"
  what: "The file /sitemap.xml is present and public."
  why: "This is informational: it is normal for many sites but worth knowing about."
  fix: "Review the contents and make sure nothing sensitive is listed."
  tags: ["info"]
safety: safe
http:
  - method: GET
    path: ["/sitemap.xml", "/sitemap_index.xml"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["<(urlset|sitemapindex)"]
