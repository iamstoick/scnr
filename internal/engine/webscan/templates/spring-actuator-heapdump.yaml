# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "spring-actuator-heapdump"
info:
  title: "Spring Boot actuator heap dump downloadable"
  severity: "critical"
  cwe: "CWE-200"
  what: "A debugging or diagnostics endpoint is enabled at /actuator/heapdump."
  why: "Debug endpoints leak configuration, environment variables, request data and sometimes allow code execution."
  fix: "Disable debug and profiler features in production and restrict any remaining diagnostics endpoints to internal networks."
  tags: ["debug", "spring"]
safety: safe
http:
  - method: GET
    path: ["/actuator/heapdump", "/heapdump"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: header
        name: "Content-Type"
        regex: ["(?i)octet-stream"]
