# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "tomcat-examples"
info:
  title: "Tomcat example applications deployed"
  severity: "medium"
  cwe: "CWE-1188"
  what: "A debugging or diagnostics endpoint is enabled at /examples/."
  why: "Debug endpoints leak configuration, environment variables, request data and sometimes allow code execution."
  fix: "Disable debug and profiler features in production and restrict any remaining diagnostics endpoints to internal networks."
  tags: ["debug", "tomcat"]
safety: safe
http:
  - method: GET
    path: ["/examples/", "/examples/servlets/", "/examples/jsp/"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(Servlet Examples|JSP Samples|Apache Tomcat Examples)"]
