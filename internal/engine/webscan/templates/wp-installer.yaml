# scnr embedded template: safe GET-only matchers, RE2 regexes.
id: "wp-installer"
info:
  title: "WordPress installer reachable"
  severity: "high"
  cwe: "CWE-1188"
  what: "An administrative or management interface is reachable at /wp-admin/install.php."
  why: "Management consoles are high-value targets: default or weak credentials, or a missing login, give full control of the application or server."
  fix: "Restrict the interface to trusted networks (VPN or allow-listed IPs), require strong authentication and MFA, and remove it if it is not needed."
  tags: ["wordpress", "admin"]
safety: safe
http:
  - method: GET
    path: ["/wp-admin/install.php", "/wp-admin/setup-config.php"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["(Installation|setup-config|Welcome to WordPress)"]
